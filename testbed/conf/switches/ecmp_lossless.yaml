# Lossless profile: PFC is enabled on every switch.
switches:
  tf_sw1:
    arch: tf1
    program: 
      name: basic_forward
      path: src/spine/basic_forward/dp/basic_forward.p4
      cp_script_path: src/spine/basic_forward/cp/init.py
    DCQCN_K_MIN: 1280
    DCQCN_K_MAX: 5120
    DCQCN_P_MAX: 0.2
    SEED_RANGE_MAX: 256
    MCAST_GRP_ID: 1
    RID: 1
    ingress_buffer_cells: 91749
    egress_buffer_cells: 91749
    skid_max_cells: 65535
    guaranteed_cells: 20
    PFC_ENABLE: true
    ingress_dynamic_baf: 6%
    egress_dynamic_baf: 50%
    ports:
      17/0: {speed: 100G, fec: none, an: default}
      18/0: {speed: 100G, fec: none, an: default}
      19/0: {speed: 100G, fec: none, an: default}
      20/0: {speed: 100G, fec: none, an: default}
