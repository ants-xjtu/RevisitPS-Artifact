# DT alpha=1/4 maps to ingress BAF=alpha/(1+alpha)=20%.
# Tofino cells: 80 B; 65536 cells = 5 MiB; 5120 cells = 400 KiB.
# Lossless profile: PFC is enabled on every switch.
switches:
  tf_sw2:
    arch: tf1
    program: 
      name: bigswitch
      path: src/single/bigswitch/dp/bigswitch.p4
      cp_script_path: src/single/bigswitch/cp/init.py
    DCQCN_K_MIN: 1280
    DCQCN_K_MAX: 5120
    DCQCN_P_MAX: 0.2
    SEED_RANGE_MAX: 256
    MCAST_GRP_ID: 1
    RID: 1
    ingress_buffer_cells: 65536
    egress_buffer_cells: 65536
    skid_max_cells: 5120
    guaranteed_cells: 20
    PFC_ENABLE: true
    ingress_dynamic_baf: 20%
    egress_dynamic_baf: DISABLE
    ports:
      1/0: {speed: 100G, fec: none, an: default}
      2/0: {speed: 100G, fec: none, an: default}
      3/0: {speed: 100G, fec: none, an: default}
      4/0: {speed: 100G, fec: none, an: default}
      5/0: {speed: 100G, fec: none, an: default}
      6/0: {speed: 100G, fec: none, an: default}
      7/0: {speed: 100G, fec: none, an: default}
      8/0: {speed: 100G, fec: none, an: default}
      9/0: {speed: 100G, fec: none, an: default}
      10/0: {speed: 100G, fec: none, an: default}
      11/0: {speed: 100G, fec: none, an: default}
      12/0: {speed: 100G, fec: none, an: default}
      13/0: {speed: 100G, fec: none, an: default}
      14/0: {speed: 100G, fec: none, an: default}
      15/0: {speed: 100G, fec: none, an: default}
      16/0: {speed: 100G, fec: none, an: default}
