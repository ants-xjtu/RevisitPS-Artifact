# Two paper experiments; algorithms are variants, not separate experiments.
experiments:
- id: lossless
  config: experiments/dcn_workload/configs/tests/lossless.yaml
  group: lossless
  traffic: trace
  trace_mode: host
  metric: fct
  # Experiment DCQCN settings; applied through live ECN sysfs.
  deployment_overrides:
    rdma:
      dcqcn: true
      dcqcn_parameters:
        roce_rp:
          clamp_tgt_rate: 0
          clamp_tgt_rate_after_time_inc: 1
          dce_tcp_g: 1019
          dce_tcp_rtt: 10
          initial_alpha_value: 1023
          rate_reduce_monitor_period: 4
          rate_to_set_on_first_cnp: 0
          rpg_ai_rate: 40
          rpg_byte_reset: 32767
          rpg_gd: 11
          rpg_hai_rate: 100
          rpg_max_rate: 0
          rpg_min_dec_fac: 50
          rpg_min_rate: 100
          rpg_threshold: 1
          rpg_time_reset: 300
        roce_np:
          cnp_802p_prio: 6
          cnp_dscp: 48
          min_time_between_cnps: 4
  variants:
  - id: bigswitch
    algorithm: BigSwitch
    config_overrides:
      config:
        switches: switches/configs/bigswitch_lossless.yaml
        topo: deployment/topologies/8-client-8-server-bigswitch.yaml
    nic_registers:
      ROCE_ACCL:
        adaptive_routing_forced_en: 0
        min_ack_timeout_limit_disabled: 1
        roce_adp_retrans_en: 0
        roce_slow_restart_en: 1
        roce_tx_window_en: 1
        selective_repeat_forced_en: 0
  - id: ecmp
    algorithm: ECMP
    config_overrides:
      config:
        switches: switches/configs/ecmp_lossless.yaml
        topo: deployment/topologies/8-client-8-server-2-leaf-8-spine.yaml
    nic_registers:
      ROCE_ACCL:
        adaptive_routing_forced_en: 0
        min_ack_timeout_limit_disabled: 1
        roce_adp_retrans_en: 0
        roce_slow_restart_en: 1
        roce_tx_window_en: 1
        selective_repeat_forced_en: 0
  - id: rps
    algorithm: RPS
    config_overrides:
      config:
        switches: switches/configs/rps_lossless.yaml
        topo: deployment/topologies/8-client-8-server-2-leaf-8-spine.yaml
    nic_registers:
      ROCE_ACCL:
        adaptive_routing_forced_en: 1
        min_ack_timeout_limit_disabled: 1
        roce_adp_retrans_en: 1
        roce_slow_restart_en: 1
        roce_tx_window_en: 1
        selective_repeat_forced_en: 0
