# Paper MTU 1000 B is represented by supported verbs MTU 1024 B.
# QP timeout uses 4.096 us * 2**n; see README for hardware differences.
name: figure2-lossless
description: 'Paper Figure 2: lossless, WebSearch, 80% of 100 Gbps, 180 seconds'
root_path: .
log:
  level: info
  dir: logs/runtime
config:
  hosts: deployment/hosts.yaml
  switches: switches/configs/bigswitch_lossless.yaml
  topo: deployment/topologies/8-client-8-server-bigswitch.yaml
  connections: experiments/dcn_workload/configs/connections/fully_connected.yaml
applications:
  gen_trace:
    seed: 42
    cdf: experiments/dcn_workload/inputs/distributions/WebSearch.txt
    load: 0.8
    bandwidth: 100G
    time: 180
    local_path: trace/WebSearch-0.8-180s
    remote_path: trace/WebSearch-0.8-180s
  remote_rdma:
    runtime_log: logs/runtime/figure2-lossless
    check:
      counter_log: data/figure2-lossless/check/counter_log
      result: data/figure2-lossless/check/result
      remote_log: data
      cmd:
        base_port: 20000
        config:
          msg_size: 65535
          qp: 1
          t_depth: 128
        sender: ib_write_bw -d {{mlx_device_name}} -i 1 -x {{gid}} --run_infinitely
          --report_gbits {{receiver_ip}} -p {{port}} -s {{msg_size}} --disable_pcie_relaxed
          -m 1024 -F -q {{qp}} -t {{t_depth}} -Q 1
        receiver: ib_write_bw -d {{mlx_device_name}} -i 1 -x {{gid}} --run_infinitely
          --report_gbits -p {{port}} -s {{msg_size}} --disable_pcie_relaxed -m 1024
          -F -q {{qp}} -t {{t_depth}} -Q 1
        timeout: 30
      kill_cmd: pkill -f ib_write_bw
    test:
      local_log: data/figure2-lossless/test/local_log
      remote_log: data
      remote_trace_dir: trace/WebSearch-0.8-180s
      cmd:
        base_port: 20000
        config:
          msg_size: 30000000
          qp: 1
          t_depth: 1000
        sender: ~/lib/perftest/ib_write_trace -d {{mlx_device_name}} -i 1 -x {{gid}}
          --report_gbits {{receiver_ip}} -p {{port}} -s {{msg_size}} --disable_pcie_relaxed
          -m 1024 -F -q {{qp}} -t {{t_depth}} --trace {{trace}} -Q 1 --qp-timeout=10
          > {{log_path}}
        receiver: ~/lib/perftest/ib_write_trace -d {{mlx_device_name}} -i 1 -x {{gid}}
          --report_gbits -p {{port}} -s {{msg_size}} --disable_pcie_relaxed -m 1024
          -F -q {{qp}} -t {{t_depth}} -Q 1 --qp-timeout=10 > {{log_path}}
        timeout: 1000
      kill_cmd: pkill -f ib_write_trace
  remote_tofino:
    cwd: testbed
    grpc_listen_port: 50052
    sync_ingore_dirs:
    - logs/
    - data/
    - testbed-venv/
    - trace/
    cmd:
      build: sde-env-9.9.1 --platform=accton_wedge100bf_32x --command 'p4_build.sh
        {{p4program_path}}'
      deploy: sde-env-9.9.1 --platform=accton_wedge100bf_32x --command 'run_switchd.sh
        -p {{p4program_name}}'
      config: sde-env-9.9.1 --platform=accton_wedge100bf_32x --python-modules=pyyaml,jinja2
        --command 'export PYTHONPATH=$PYTHONPATH:. && python3 {{cp_script_path}}
        --hostname {{hostname}} --topo {{topo}} --switches {{switches}} --hosts {{hosts}}'
  analysis:
    input_folder: data/figure2-lossless/test/local_log
    output_folder: data/processed/figure2-lossless
  plot:
    function: fct
paper_parameters:
  figure: 2(a)
  mtu_bytes: 1000
  verbs_mtu_bytes: 1024
  rto_us: 4096
  qp_timeout_exponent: 10
  verbs_timeout_us: 4194.304
  psn_window_packets: 128
  buffer_bytes: 5242880
  headroom_bytes: 409600
  dt_alpha: 0.25
  ecn_kmin_bytes: 102400
  ecn_kmax_bytes: 409600
  ecn_pmax: 0.2
